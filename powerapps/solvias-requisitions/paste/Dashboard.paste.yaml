                  X: =560
                  Y: =0
                  Width: =180
                  Height: =48
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  Size: =10
                  Color: =RGBA(64, 64, 65, 1)
                  OnSelect: =Select(Parent)
            - lblRowAmount:
                Control: Label
                Properties:
                  Text: =If(varCurrency = "CHF", "CHF ", "$") & Text(ThisItem.Amount, "#,##0.00")
                  X: =750
                  Y: =0
                  Width: =120
                  Height: =48
                  Align: =Align.Right
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  Size: =10
                  Color: =RGBA(64, 64, 65, 1)
                  OnSelect: =Select(Parent)
            - lblRowStatus:
                Control: Label
                Properties:
                  Text: |
                    =Switch(ThisItem.Status,
                      "Pending", "Awaiting approval",
                      "Review", "In review",
                      "Returned", "Returned for edit",
                      ThisItem.Status)
                  X: =900
                  Y: =12
                  Width: =130
                  Height: =24
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =8.5
                  Color: |
                    =Switch(ThisItem.Status,
                      "Draft", RGBA(64,64,65,1),
                      "Pending", RGBA(0,73,122,1),
                      "Review", RGBA(122,90,0,1),
                      "Approved", RGBA(74,107,0,1),
                      "Returned", RGBA(122,90,0,1),
                      "Rejected", RGBA(197,0,68,1),
                      RGBA(0,73,122,1))
                  Fill: |
                    =Switch(ThisItem.Status,
                      "Draft", RGBA(236,236,236,1),
                      "Pending", RGBA(239,247,249,1),
                      "Review", RGBA(251,243,220,1),
                      "Approved", RGBA(247,250,229,1),
                      "Returned", RGBA(251,243,220,1),
                      "Rejected", RGBA(249,229,237,1),
                      RGBA(229,237,243,1))
                  OnSelect: =Select(Parent)
            - recRowDivider:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =47
                  Width: =1050
                  Height: =1
                  Fill: =RGBA(236, 239, 242, 1)
