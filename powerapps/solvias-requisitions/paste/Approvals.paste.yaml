
- conSidebar_Appr:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =248
      Height: =768
      Fill: =RGBA(255, 255, 255, 1)
    Children:
      - recSideBorder_Appr:
          Control: Rectangle
          Properties:
            X: =247
            Y: =0
            Width: =1
            Height: =768
            Fill: =RGBA(227, 230, 234, 1)
      - lblLogo_Appr:
          Control: Label
          Properties:
            Text: ="Solvias"
            X: =22
            Y: =17
            Width: =150
            Height: =26
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =14
            Color: =RGBA(0, 73, 122, 1)
      - recLogoDivider_Appr:
          Control: Rectangle
          Properties:
            X: =0
            Y: =60
            Width: =248
            Height: =1
            Fill: =RGBA(227, 230, 234, 1)
      - btnNewReq_Appr:
          Control: Classic/Button
          Properties:
            Text: ="+  New requisition"
            X: =12
            Y: =76
            Width: =224
            Height: =40
            Fill: =RGBA(0, 73, 122, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -10%)
            PressedFill: =ColorFade(Self.Fill, -20%)
            BorderStyle: =BorderStyle.None
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =11
            OnSelect: =Navigate(NewRequisition, ScreenTransition.None)
      - lblSectionWorkspace_Appr:
          Control: Label
          Properties:
            Text: ="WORKSPACE"
            X: =22
            Y: =130
            Width: =200
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =7.5
            Color: =RGBA(140, 140, 141, 1)
      - galNav_Appr:
          Control: Gallery
          Properties:
            Layout: =Layout.Vertical
            X: =12
            Y: =152
            Width: =224
            Height: =210
            TemplateSize: =40
            TemplatePadding: =1
            ShowScrollbar: =false
            Items: |
              =Table(
                {Label:"Dashboard",    Screen:"Dashboard"},
                {Label:"Requisitions", Screen:"Requisitions"},
                {Label:"Approvals",    Screen:"Approvals"},
                {Label:"Suppliers",    Screen:"Suppliers"},
                {Label:"Analytics",    Screen:"Analytics"}
              )
            OnSelect: |
              =Switch(ThisItem.Screen,
                "Dashboard",    Navigate(Dashboard, ScreenTransition.None),
                "Requisitions", Navigate(Requisitions, ScreenTransition.None),
                "Approvals",    Navigate(Approvals, ScreenTransition.None),
                "Suppliers",    Navigate(Suppliers, ScreenTransition.None),
                "Analytics",    Navigate(Analytics, ScreenTransition.None))
          Children:
            - recNavActive_Appr:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =2
                  Width: =224
                  Height: =36
                  Fill: =If(ThisItem.Screen = "Approvals", RGBA(229, 237, 243, 1), RGBA(0, 0, 0, 0))
                  OnSelect: =Select(Parent)
            - lblNavItem_Appr:
                Control: Label
                Properties:
                  Text: =ThisItem.Label
                  X: =14
                  Y: =2
                  Width: =200
                  Height: =36
                  Font: =Font.Arial
                  Size: =11
                  FontWeight: =If(ThisItem.Screen = "Approvals", FontWeight.Bold, FontWeight.Normal)
                  Color: =If(ThisItem.Screen = "Approvals", RGBA(0, 73, 122, 1), RGBA(64, 64, 65, 1))
                  OnSelect: =Select(Parent)
      - lblSectionAdmin_Appr:
          Control: Label
          Properties:
            Text: ="ADMINISTRATION"
            X: =22
            Y: =372
            Width: =200
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =7.5
            Color: =RGBA(140, 140, 141, 1)
      - lblNavSettings_Appr:
          Control: Label
          Properties:
            Text: ="Settings"
            X: =26
            Y: =394
            Width: =210
            Height: =36
            Font: =Font.Arial
            Size: =11
            Color: =If("Approvals" = "Settings", RGBA(0, 73, 122, 1), RGBA(64, 64, 65, 1))
            FontWeight: =If("Approvals" = "Settings", FontWeight.Bold, FontWeight.Normal)
            OnSelect: =Navigate(Settings, ScreenTransition.None)
      - recUserDivider_Appr:
          Control: Rectangle
          Properties:
            X: =0
            Y: =700
            Width: =248
            Height: =1
            Fill: =RGBA(236, 239, 242, 1)
      - lblUserName_Appr:
          Control: Label
          Properties:
            Text: =If(varRole = "Approver", "M. Brunner", "Lina Roth")
            X: =62
            Y: =712
            Width: =170
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =10
            Color: =RGBA(64, 64, 65, 1)
      - lblUserRole_Appr:
          Control: Label
          Properties:
            Text: =If(varRole = "Approver", "Finance lead · Approver", "Procurement lead · Requester")
            X: =62
            Y: =732
            Width: =180
            Height: =18
            Font: =Font.Arial
            Size: =8.5
            Color: =RGBA(140, 140, 141, 1)
      - lblUserAvatar_Appr:
          Control: Label
          Properties:
            Text: =If(varRole = "Approver", "MB", "LR")
            X: =18
            Y: =714
            Width: =34
            Height: =34
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =9
            Color: =RGBA(0, 73, 122, 1)
            Fill: =RGBA(229, 237, 243, 1)


- lblAppTitle:
    Control: Label
    Properties:
      Text: ="Approvals"
      X: =282
      Y: =84
      Width: =500
      Height: =40
      Font: =Font.Arial
      FontWeight: =FontWeight.Lighter
      Size: =24
      Color: =RGBA(0, 73, 122, 1)
- lblAppSub:
    Control: Label
    Properties:
      Text: |
        =If(varRole = "Approver",
          CountRows(Filter(colRequisitions, Status in ["Pending","Review"])) & " requisitions are waiting for your sign-off.",
          "Track where submissions from your team stand in the approval chain.")
      X: =282
      Y: =124
      Width: =700
      Height: =22
      Font: =Font.Arial
      Size: =10.5
      Color: =RGBA(140, 140, 141, 1)
- galApprovals:
    Control: Gallery
    Properties:
      Layout: =Layout.Vertical
      X: =282
      Y: =160
      Width: =1050
      Height: =574
      TemplateSize: =140
      TemplatePadding: =14
      Items: =Filter(colRequisitions, Status in ["Pending","Review"])
    Children:
      - recAppCard:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =1050
            Height: =126
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(227, 230, 234, 1)
            BorderThickness: =1
            BorderStyle: =BorderStyle.Solid
      - recAppSide:
          Control: Rectangle
          Properties:
            X: =750
            Y: =1
            Width: =299
            Height: =124
            Fill: =RGBA(247, 248, 250, 1)
      - lblAppPr:
          Control: Label
          Properties:
            Text: =ThisItem.Id
            X: =22
            Y: =14
            Width: =140
            Height: =20
            Font: =Font.'Courier New'
            Size: =9
            Color: =RGBA(140, 140, 141, 1)
            OnSelect: =Set(varSelectedPr, ThisItem.Id); Navigate(RequisitionDetail, ScreenTransition.None)
      - lblAppReqTitle:
          Control: Label
          Properties:
            Text: =ThisItem.Title
            X: =22
            Y: =36
            Width: =700
            Height: =26
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =RGBA(0, 73, 122, 1)
            OnSelect: =Set(varSelectedPr, ThisItem.Id); Navigate(RequisitionDetail, ScreenTransition.None)
      - lblAppMeta:
          Control: Label
          Properties:
            Text: =ThisItem.Requester & " · " & ThisItem.CostCenter & " · needed " & Text(ThisItem.NeededBy, "dd mmm yyyy")
            X: =22
            Y: =64
            Width: =700
            Height: =20
            Font: =Font.Arial
            Size: =9
            Color: =RGBA(140, 140, 141, 1)
      - lblAppAmountLabel:
          Control: Label
          Properties:
            Text: ="TOTAL AMOUNT"
            X: =772
            Y: =14
            Width: =200
            Height: =16
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =7.5
            Color: =RGBA(140, 140, 141, 1)
      - lblAppAmount:
          Control: Label
          Properties:
            Text: =If(varCurrency = "CHF", "CHF ", "$") & Text(ThisItem.Amount, "#,##0.00")
            X: =772
            Y: =30
            Width: =260
            Height: =34
            Font: =Font.Arial
            FontWeight: =FontWeight.Lighter
            Size: =19
            Color: =RGBA(0, 73, 122, 1)
      - btnAppReject:
          Control: Classic/Button
          Properties:
            Text: ="Reject…"
            X: =772
            Y: =76
            Width: =110
            Height: =34
            Fill: =RGBA(197, 0, 68, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -10%)
            BorderStyle: =BorderStyle.None
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =9.5
            Visible: =varRole = "Approver"
            OnSelect: |
              =Set(varDeclineId, ThisItem.Id);
               Set(varDeclineMode, "Return");
               Set(varShowDecline, true)
      - btnAppApprove:
          Control: Classic/Button
          Properties:
            Text: ="✓ Approve"
            X: =892
            Y: =76
            Width: =140
            Height: =34
            Fill: =RGBA(175, 209, 0, 1)
            Color: =RGBA(0, 73, 122, 1)
            HoverFill: =ColorFade(Self.Fill, -10%)
            BorderStyle: =BorderStyle.None
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =9.5
            Visible: =varRole = "Approver"
            OnSelect: |
              =Patch(colRequisitions, ThisItem, {Status:"Approved"});
               Notify(ThisItem.Id & " approved — purchase order drafted", NotificationType.Success)
      - lblAppViewerNote:
          Control: Label
          Properties:
            Text: ="Viewing as requester — approval actions are available to M. Brunner."
            X: =772
            Y: =76
            Width: =260
            Height: =40
            Font: =Font.Arial
            Size: =9
            Color: =RGBA(140, 140, 141, 1)
            Visible: =varRole <> "Approver"
