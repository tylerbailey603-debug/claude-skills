- conNeedsYou:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =282
      Y: =158
      Width: =1050
      Height: =64
      Fill: =RGBA(229, 237, 243, 1)
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
    Children:
      - lblNeedsYouTitle:
          Control: Label
          Properties:
            Text: |
              =CountRows(Filter(colRequisitions, Status in ["Pending","Review"])) &
               If(varRole = "Approver", " requisitions are waiting for your approval", " requisitions are in the approval queue")
            X: =18
            Y: =10
            Width: =700
            Height: =24
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =10.5
            Color: =RGBA(0, 73, 122, 1)
      - lblNeedsYouSub:
          Control: Label
          Properties:
            Text: ="Oldest has been pending 3 days · " & Text(Sum(Filter(colRequisitions, Status in ["Pending","Review"]), Amount), "$#,##0.00") & " total"
            X: =18
            Y: =34
            Width: =700
            Height: =20
            Font: =Font.Arial
            Size: =9
            Color: =RGBA(140, 140, 141, 1)
      - btnReviewApprovals:
          Control: Classic/Button
          Properties:
            Text: ="Review approvals →"
            X: =870
            Y: =14
            Width: =164
            Height: =36
            Fill: =RGBA(0, 73, 122, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -10%)
            BorderStyle: =BorderStyle.None
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =10
            OnSelect: =Navigate(Approvals, ScreenTransition.None)
- galKpis:
    Control: Gallery
    Properties:
      Layout: =Layout.Horizontal
      X: =282
      Y: =238
      Width: =1050
      Height: =110
      TemplateSize: =262
      TemplatePadding: =0
      ShowScrollbar: =false
      Items: |
        =Table(
          {Label:"OPEN REQUISITIONS",      Value:Text(CountRows(Filter(colRequisitions, Status in ["Pending","Review","Draft"]))), Sub:"vs last week"},
          {Label:"AWAITING YOUR APPROVAL", Value:Text(CountRows(Filter(colRequisitions, Status in ["Pending","Review"]))),          Sub:"2 escalated"},
          {Label:"SPEND THIS QUARTER",     Value:"$" & Text(Round(Sum(Filter(colRequisitions, Status = "Approved"), Amount)/1000, 0)) & "k", Sub:"of $520k budget"},
          {Label:"AVG CYCLE TIME",         Value:"2.4d", Sub:"vs target 3.0d"}
        )
    Children:
      - recKpiCard:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =254
            Height: =110
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(227, 230, 234, 1)
            BorderThickness: =1
            BorderStyle: =BorderStyle.Solid
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
      - lblKpiLabel:
          Control: Label
          Properties:
            Text: =ThisItem.Label
            X: =20
            Y: =14
            Width: =220
            Height: =18
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =8
            Color: =RGBA(140, 140, 141, 1)
      - lblKpiValue:
          Control: Label
          Properties:
            Text: =ThisItem.Value
            X: =20
            Y: =34
            Width: =220
            Height: =44
            Font: =Font.Arial
            FontWeight: =FontWeight.Lighter
            Size: =26
            Color: =RGBA(0, 73, 122, 1)
      - lblKpiSub:
          Control: Label
          Properties:
            Text: =ThisItem.Sub
            X: =20
            Y: =80
            Width: =220
            Height: =18
            Font: =Font.Arial
            Size: =9
            Color: =RGBA(140, 140, 141, 1)
