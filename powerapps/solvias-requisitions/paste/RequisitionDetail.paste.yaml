- conAttach:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =992
      Y: =516
      Width: =340
      Height: =218
      Fill: =RGBA(255, 255, 255, 1)
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
    Children:
      - lblAttachTitle:
          Control: Label
          Properties:
            Text: ="Attachments"
            X: =20
            Y: =10
            Width: =200
            Height: =28
            Font: =Font.Arial
            Size: =13
            Color: =RGBA(0, 73, 122, 1)
      - galAttach:
          Control: Gallery
          Properties:
            Layout: =Layout.Vertical
            X: =0
            Y: =46
            Width: =340
            Height: =120
            TemplateSize: =36
            TemplatePadding: =0
            Items: =Filter(colAttachments, PRNumber = varPr.Id)
          Children:
            - lblAttachName:
                Control: Label
                Properties:
                  Text: =ThisItem.FileName
                  X: =20
                  Y: =0
                  Width: =260
                  Height: =36
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =10
                  Color: =RGBA(0, 73, 122, 1)
            - lblAttachRemove:
                Control: Label
                Properties:
                  Text: ="✕"
                  X: =294
                  Y: =0
                  Width: =30
                  Height: =36
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  Size: =10
                  Color: =RGBA(179, 179, 179, 1)
                  OnSelect: =Remove(colAttachments, ThisItem)
      - lblAttachEmpty:
          Control: Label
          Properties:
            Text: ="No files attached. Quotes and specs added here are visible to approvers."
            X: =20
            Y: =70
            Width: =300
            Height: =50
            Align: =Align.Center
            Font: =Font.Arial
            Size: =9.5
            Color: =RGBA(140, 140, 141, 1)
            Visible: =CountRows(galAttach.AllItems) = 0
      - btnAttachAdd:
          Control: Classic/Button
          Properties:
            Text: ="+ Attach"
            X: =20
            Y: =172
            Width: =300
            Height: =34
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(0, 73, 122, 1)
            BorderColor: =RGBA(199, 204, 210, 1)
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =9.5
            OnSelect: |
              =Collect(colAttachments, {PRNumber: varPr.Id, FileName: "Attachment_" & (CountRows(Filter(colAttachments, PRNumber = varPr.Id)) + 1) & ".pdf"});
               Notify("File attached", NotificationType.Success)
