Screens:
  Requisitions:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      OnVisible: |
        =Set(varReqTab, "All")
    Children:

      - conSidebar_Reqs:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =248
            Height: =768
            Fill: =RGBA(255, 255, 255, 1)
          Children:
            - recSideBorder_Reqs:
                Control: Rectangle
                Properties:
                  X: =247
                  Y: =0
                  Width: =1
                  Height: =768
                  Fill: =RGBA(227, 230, 234, 1)
            - lblLogo_Reqs:
                Control: Label
                Properties:
                  Text: ="Solvias"
                  X: =22
                  Y: =17
                  Width: =150
                  Height: =26
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =14
                  Color: =RGBA(0, 73, 122, 1)
            - recLogoDivider_Reqs:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =60
                  Width: =248
                  Height: =1
                  Fill: =RGBA(227, 230, 234, 1)
            - btnNewReq_Reqs:
                Control: Classic/Button
                Properties:
                  Text: ="+  New requisition"
                  X: =12
                  Y: =76
                  Width: =224
                  Height: =40
                  Fill: =RGBA(0, 73, 122, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(Self.Fill, -10%)
                  PressedFill: =ColorFade(Self.Fill, -20%)
                  BorderStyle: =BorderStyle.None
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =11
                  OnSelect: =Navigate(NewRequisition, ScreenTransition.None)
            - lblSectionWorkspace_Reqs:
                Control: Label
                Properties:
                  Text: ="WORKSPACE"
                  X: =22
                  Y: =130
                  Width: =200
                  Height: =20
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =7.5
                  Color: =RGBA(140, 140, 141, 1)
            - galNav_Reqs:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =12
                  Y: =152
                  Width: =224
                  Height: =210
                  TemplateSize: =40
                  TemplatePadding: =1
                  ShowScrollbar: =false
                  Items: |
                    =Table(
                      {Label:"Dashboard",    Screen:"Dashboard"},
                      {Label:"Requisitions", Screen:"Requisitions"},
                      {Label:"Approvals",    Screen:"Approvals"},
                      {Label:"Suppliers",    Screen:"Suppliers"},
                      {Label:"Analytics",    Screen:"Analytics"}
                    )
                  OnSelect: |
                    =Switch(ThisItem.Screen,
                      "Dashboard",    Navigate(Dashboard, ScreenTransition.None),
                      "Requisitions", Navigate(Requisitions, ScreenTransition.None),
                      "Approvals",    Navigate(Approvals, ScreenTransition.None),
                      "Suppliers",    Navigate(Suppliers, ScreenTransition.None),
                      "Analytics",    Navigate(Analytics, ScreenTransition.None))
                Children:
                  - recNavActive_Reqs:
                      Control: Rectangle
                      Properties:
                        X: =0
                        Y: =2
                        Width: =224
                        Height: =36
                        Fill: =If(ThisItem.Screen = "Requisitions", RGBA(229, 237, 243, 1), RGBA(0, 0, 0, 0))
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: =Select(Parent)
                  - lblNavItem_Reqs:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Label
                        X: =14
                        Y: =2
                        Width: =200
                        Height: =36
                        Font: =Font.Arial
                        Size: =11
                        FontWeight: =If(ThisItem.Screen = "Requisitions", FontWeight.Bold, FontWeight.Normal)
                        Color: =If(ThisItem.Screen = "Requisitions", RGBA(0, 73, 122, 1), RGBA(64, 64, 65, 1))
                        OnSelect: =Select(Parent)
            - lblSectionAdmin_Reqs:
                Control: Label
                Properties:
                  Text: ="ADMINISTRATION"
                  X: =22
                  Y: =372
                  Width: =200
                  Height: =20
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =7.5
                  Color: =RGBA(140, 140, 141, 1)
            - lblNavSettings_Reqs:
                Control: Label
                Properties:
                  Text: ="Settings"
                  X: =26
                  Y: =394
                  Width: =210
                  Height: =36
                  Font: =Font.Arial
                  Size: =11
                  Color: =If("Requisitions" = "Settings", RGBA(0, 73, 122, 1), RGBA(64, 64, 65, 1))
                  FontWeight: =If("Requisitions" = "Settings", FontWeight.Bold, FontWeight.Normal)
                  OnSelect: =Navigate(Settings, ScreenTransition.None)
            - recUserDivider_Reqs:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =700
                  Width: =248
                  Height: =1
                  Fill: =RGBA(236, 239, 242, 1)
            - lblUserName_Reqs:
                Control: Label
                Properties:
                  Text: =If(varRole = "Approver", "M. Brunner", "Lina Roth")
                  X: =62
                  Y: =712
                  Width: =170
                  Height: =20
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =10
                  Color: =RGBA(64, 64, 65, 1)
            - lblUserRole_Reqs:
                Control: Label
                Properties:
                  Text: =If(varRole = "Approver", "Finance lead · Approver", "Procurement lead · Requester")
                  X: =62
                  Y: =732
                  Width: =180
                  Height: =18
                  Font: =Font.Arial
                  Size: =8.5
                  Color: =RGBA(140, 140, 141, 1)
            - lblUserAvatar_Reqs:
                Control: Label
                Properties:
                  Text: =If(varRole = "Approver", "MB", "LR")
                  X: =18
                  Y: =714
                  Width: =34
                  Height: =34
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  FontWeight: =FontWeight.Bold
                  Size: =9
                  Color: =RGBA(0, 73, 122, 1)
                  Fill: =RGBA(229, 237, 243, 1)


      - lblReqTitle:
          Control: Label
          Properties:
            Text: ="Requisitions"
            X: =282
            Y: =84
            Width: =500
            Height: =40
            Font: =Font.Arial
            FontWeight: =FontWeight.Lighter
            Size: =24
            Color: =RGBA(0, 73, 122, 1)
      - lblReqSub:
          Control: Label
          Properties:
            Text: ="All purchase requisitions across your team."
            X: =282
            Y: =124
            Width: =500
            Height: =22
            Font: =Font.Arial
            Size: =10.5
            Color: =RGBA(140, 140, 141, 1)
      - txtReqSearch:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="Search PRs, suppliers, materials…"
            X: =900
            Y: =92
            Width: =300
            Height: =38
            Font: =Font.Arial
            Size: =10.5
            BorderColor: =RGBA(227, 230, 234, 1)
            BorderThickness: =1
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            Fill: =RGBA(247, 248, 250, 1)
            OnChange: =Set(varSearch, Self.Text)
      - btnReqNew:
          Control: Classic/Button
          Properties:
            Text: ="+ New requisition"
            X: =1212
            Y: =92
            Width: =150
            Height: =38
            Fill: =RGBA(0, 73, 122, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -10%)
            BorderStyle: =BorderStyle.None
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =10
            OnSelect: =Navigate(NewRequisition, ScreenTransition.None)
      - galReqTabs:
          Control: Gallery
          Variant: Horizontal
          Properties:
            X: =282
            Y: =158
            Width: =1050
            Height: =38
            TemplateSize: =150
            TemplatePadding: =0
            ShowScrollbar: =false
            Items: |
              =Table(
                {Tab:"All"}, {Tab:"Draft"}, {Tab:"Pending"}, {Tab:"Review"},
                {Tab:"Approved"}, {Tab:"Returned"}, {Tab:"Rejected"}
              )
            OnSelect: =Set(varReqTab, ThisItem.Tab)
          Children:
            - lblTab:
                Control: Label
                Properties:
                  Text: |
                    =ThisItem.Tab & "  · " &
                     If(ThisItem.Tab = "All", CountRows(colRequisitions),
                        CountRows(Filter(colRequisitions, Status = ThisItem.Tab)))
                  X: =0
                  Y: =0
                  Width: =144
                  Height: =34
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Font: =Font.Arial
                  FontWeight: =If(varReqTab = ThisItem.Tab, FontWeight.Bold, FontWeight.Normal)
                  Size: =10
                  Color: =If(varReqTab = ThisItem.Tab, RGBA(0, 73, 122, 1), RGBA(140, 140, 141, 1))
                  OnSelect: =Select(Parent)
            - recTabUnderline:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =34
                  Width: =144
                  Height: =2
                  Fill: =If(varReqTab = ThisItem.Tab, RGBA(0, 73, 122, 1), RGBA(0, 0, 0, 0))
      - conReqCard:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =282
            Y: =210
            Width: =1050
            Height: =524
            Fill: =RGBA(255, 255, 255, 1)
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
          Children:
            - galRequisitions:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =0
                  Y: =30
                  Width: =1050
                  Height: =494
                  TemplateSize: =48
                  TemplatePadding: =0
                  Items: |
                    =Filter(colRequisitions,
                      (varReqTab = "All" || Status = varReqTab) &&
                      (IsBlank(varSearch) || varSearch in Id || varSearch in Title ||
                       varSearch in Vendor || varSearch in Requester || varSearch in CostCenter))
                  OnSelect: =Set(varSelectedPr, ThisItem.Id); Navigate(RequisitionDetail, ScreenTransition.None)
                Children:
                  - lblRqPr:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Id
                        X: =20
                        Y: =0
                        Width: =130
                        Height: =48
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =Font.'Courier New'
                        Size: =9
                        Color: =RGBA(140, 140, 141, 1)
                        OnSelect: =Select(Parent)
                  - lblRqTitle:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Title
                        X: =158
                        Y: =0
                        Width: =320
                        Height: =48
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =Font.Arial
                        FontWeight: =FontWeight.Bold
                        Size: =10
                        Color: =RGBA(64, 64, 65, 1)
                        OnSelect: =Select(Parent)
                  - lblRqRequester:
                      Control: Label
                      Properties:
                        Text: =ThisItem.Requester
                        X: =488
                        Y: =0
                        Width: =110
                        Height: =48
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =Font.Arial
                        Size: =10
                        Color: =RGBA(64, 64, 65, 1)
                        OnSelect: =Select(Parent)
                  - lblRqCc:
                      Control: Label
                      Properties:
                        Text: =ThisItem.CostCenter
                        X: =606
                        Y: =0
                        Width: =150
                        Height: =48
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =Font.'Courier New'
                        Size: =8.5
                        Color: =RGBA(140, 140, 141, 1)
                        OnSelect: =Select(Parent)
                  - lblRqAmount:
                      Control: Label
                      Properties:
                        Text: =If(varCurrency = "CHF", "CHF ", "$") & Text(ThisItem.Amount, "#,##0.00")
                        X: =760
                        Y: =0
                        Width: =110
                        Height: =48
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =Font.Arial
                        Size: =10
                        Color: =RGBA(64, 64, 65, 1)
                        OnSelect: =Select(Parent)
                  - lblRqStatus:
                      Control: Label
                      Properties:
                        Text: |
                          =Switch(ThisItem.Status,
                            "Pending", "Awaiting approval",
                            "Review", "In review",
                            "Returned", "Returned for edit",
                            ThisItem.Status)
                        X: =892
                        Y: =12
                        Width: =138
                        Height: =24
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Font: =Font.Arial
                        FontWeight: =FontWeight.Bold
                        Size: =8.5
                        Color: |
                          =Switch(ThisItem.Status,
                            "Draft", RGBA(64,64,65,1),
                            "Pending", RGBA(0,73,122,1),
                            "Review", RGBA(122,90,0,1),
                            "Approved", RGBA(74,107,0,1),
                            "Returned", RGBA(122,90,0,1),
                            "Rejected", RGBA(197,0,68,1),
                            RGBA(0,73,122,1))
                        Fill: |
                          =Switch(ThisItem.Status,
                            "Draft", RGBA(236,236,236,1),
                            "Pending", RGBA(239,247,249,1),
                            "Review", RGBA(251,243,220,1),
                            "Approved", RGBA(247,250,229,1),
                            "Returned", RGBA(251,243,220,1),
                            "Rejected", RGBA(249,229,237,1),
                            RGBA(229,237,243,1))
                        OnSelect: =Select(Parent)
                  - recRqDivider:
                      Control: Rectangle
                      Properties:
                        X: =0
                        Y: =47
                        Width: =1050
                        Height: =1
                        Fill: =RGBA(236, 239, 242, 1)
            - lblReqEmpty:
                Control: Label
                Properties:
                  Text: |
                    =If(IsBlank(varSearch),
                      "Nothing here yet — no requisitions match this status.",
                      "No results for “" & varSearch & "”. Check the spelling, or search by PR number, vendor, requester, or cost center.")
                  X: =0
                  Y: =180
                  Width: =1050
                  Height: =60
                  Align: =Align.Center
                  Font: =Font.Arial
                  Size: =11
                  Color: =RGBA(140, 140, 141, 1)
                  Visible: =CountRows(galRequisitions.AllItems) = 0

