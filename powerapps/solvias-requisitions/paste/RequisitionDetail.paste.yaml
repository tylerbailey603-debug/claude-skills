
- conSidebar_Det:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =0
      Y: =0
      Width: =248
      Height: =768
      Fill: =RGBA(255, 255, 255, 1)
    Children:
      - recSideBorder_Det:
          Control: Rectangle
          Properties:
            X: =247
            Y: =0
            Width: =1
            Height: =768
            Fill: =RGBA(227, 230, 234, 1)
      - lblLogo_Det:
          Control: Label
          Properties:
            Text: ="Solvias"
            X: =22
            Y: =17
            Width: =150
            Height: =26
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =14
            Color: =RGBA(0, 73, 122, 1)
      - recLogoDivider_Det:
          Control: Rectangle
          Properties:
            X: =0
            Y: =60
            Width: =248
            Height: =1
            Fill: =RGBA(227, 230, 234, 1)
      - btnNewReq_Det:
          Control: Classic/Button
          Properties:
            Text: ="+  New requisition"
            X: =12
            Y: =76
            Width: =224
            Height: =40
            Fill: =RGBA(0, 73, 122, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -10%)
            PressedFill: =ColorFade(Self.Fill, -20%)
            BorderStyle: =BorderStyle.None
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =11
            OnSelect: =Navigate(NewRequisition, ScreenTransition.None)
      - lblSectionWorkspace_Det:
          Control: Label
          Properties:
            Text: ="WORKSPACE"
            X: =22
            Y: =130
            Width: =200
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =7.5
            Color: =RGBA(140, 140, 141, 1)
      - galNav_Det:
          Control: Gallery
          Properties:
            Layout: =Layout.Vertical
            X: =12
            Y: =152
            Width: =224
            Height: =210
            TemplateSize: =40
            TemplatePadding: =1
            ShowScrollbar: =false
            Items: |
              =Table(
                {Label:"Dashboard",    Screen:"Dashboard"},
                {Label:"Requisitions", Screen:"Requisitions"},
                {Label:"Approvals",    Screen:"Approvals"},
                {Label:"Suppliers",    Screen:"Suppliers"},
                {Label:"Analytics",    Screen:"Analytics"}
              )
            OnSelect: |
              =Switch(ThisItem.Screen,
                "Dashboard",    Navigate(Dashboard, ScreenTransition.None),
                "Requisitions", Navigate(Requisitions, ScreenTransition.None),
                "Approvals",    Navigate(Approvals, ScreenTransition.None),
                "Suppliers",    Navigate(Suppliers, ScreenTransition.None),
                "Analytics",    Navigate(Analytics, ScreenTransition.None))
          Children:
            - recNavActive_Det:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =2
                  Width: =224
                  Height: =36
                  Fill: =If(ThisItem.Screen = "RequisitionDetail", RGBA(229, 237, 243, 1), RGBA(0, 0, 0, 0))
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Select(Parent)
            - lblNavItem_Det:
                Control: Label
                Properties:
                  Text: =ThisItem.Label
                  X: =14
                  Y: =2
                  Width: =200
                  Height: =36
                  Font: =Font.Arial
                  Size: =11
                  FontWeight: =If(ThisItem.Screen = "RequisitionDetail", FontWeight.Bold, FontWeight.Normal)
                  Color: =If(ThisItem.Screen = "RequisitionDetail", RGBA(0, 73, 122, 1), RGBA(64, 64, 65, 1))
                  OnSelect: =Select(Parent)
      - lblSectionAdmin_Det:
          Control: Label
          Properties:
            Text: ="ADMINISTRATION"
            X: =22
            Y: =372
            Width: =200
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =7.5
            Color: =RGBA(140, 140, 141, 1)
      - lblNavSettings_Det:
          Control: Label
          Properties:
            Text: ="Settings"
            X: =26
            Y: =394
            Width: =210
            Height: =36
            Font: =Font.Arial
            Size: =11
            Color: =If("RequisitionDetail" = "Settings", RGBA(0, 73, 122, 1), RGBA(64, 64, 65, 1))
            FontWeight: =If("RequisitionDetail" = "Settings", FontWeight.Bold, FontWeight.Normal)
            OnSelect: =Navigate(Settings, ScreenTransition.None)
      - recUserDivider_Det:
          Control: Rectangle
          Properties:
            X: =0
            Y: =700
            Width: =248
            Height: =1
            Fill: =RGBA(236, 239, 242, 1)
      - lblUserName_Det:
          Control: Label
          Properties:
            Text: =If(varRole = "Approver", "M. Brunner", "Lina Roth")
            X: =62
            Y: =712
            Width: =170
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =10
            Color: =RGBA(64, 64, 65, 1)
      - lblUserRole_Det:
          Control: Label
          Properties:
            Text: =If(varRole = "Approver", "Finance lead · Approver", "Procurement lead · Requester")
            X: =62
            Y: =732
            Width: =180
            Height: =18
            Font: =Font.Arial
            Size: =8.5
            Color: =RGBA(140, 140, 141, 1)
      - lblUserAvatar_Det:
          Control: Label
          Properties:
            Text: =If(varRole = "Approver", "MB", "LR")
            X: =18
            Y: =714
            Width: =34
            Height: =34
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =9
            Color: =RGBA(0, 73, 122, 1)
            Fill: =RGBA(229, 237, 243, 1)


- lblDetCrumb:
    Control: Label
    Properties:
      Text: ="Requisitions  /  " & varPr.Id
      X: =282
      Y: =70
      Width: =400
      Height: =18
      Font: =Font.Arial
      Size: =9
      Color: =RGBA(140, 140, 141, 1)
      OnSelect: =Navigate(Requisitions, ScreenTransition.None)
- lblDetTitle:
    Control: Label
    Properties:
      Text: =varPr.Title
      X: =282
      Y: =90
      Width: =700
      Height: =38
      Font: =Font.Arial
      FontWeight: =FontWeight.Lighter
      Size: =21
      Color: =RGBA(0, 73, 122, 1)
- lblDetChip:
    Control: Label
    Properties:
      Text: |
        =Switch(varPr.Status,
          "Pending", "Awaiting approval",
          "Review", "In review",
          "Returned", "Returned for edit",
          varPr.Status)
      X: =282
      Y: =132
      Width: =130
      Height: =24
      Align: =Align.Center
      VerticalAlign: =VerticalAlign.Middle
      Font: =Font.Arial
      FontWeight: =FontWeight.Bold
      Size: =8.5
      Color: |
        =Switch(varPr.Status,
          "Draft", RGBA(64,64,65,1),
          "Pending", RGBA(0,73,122,1),
          "Review", RGBA(122,90,0,1),
          "Approved", RGBA(74,107,0,1),
          "Returned", RGBA(122,90,0,1),
          "Rejected", RGBA(197,0,68,1),
          RGBA(0,73,122,1))
      Fill: |
        =Switch(varPr.Status,
          "Draft", RGBA(236,236,236,1),
          "Pending", RGBA(239,247,249,1),
          "Review", RGBA(251,243,220,1),
          "Approved", RGBA(247,250,229,1),
          "Returned", RGBA(251,243,220,1),
          "Rejected", RGBA(249,229,237,1),
          RGBA(229,237,243,1))
- lblDetMeta:
    Control: Label
    Properties:
      Text: ="Requested by " & varPr.Requester & "  ·  needed " & Text(varPr.NeededBy, "dd mmm yyyy")
      X: =424
      Y: =132
      Width: =500
      Height: =24
      VerticalAlign: =VerticalAlign.Middle
      Font: =Font.Arial
      Size: =9.5
      Color: =RGBA(140, 140, 141, 1)
- btnDetReject:
    Control: Classic/Button
    Properties:
      Text: ="Reject…"
      X: =1080
      Y: =92
      Width: =110
      Height: =38
      Fill: =RGBA(197, 0, 68, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -10%)
      BorderStyle: =BorderStyle.None
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Font: =Font.Arial
      FontWeight: =FontWeight.Bold
      Size: =10
      Visible: =varRole = "Approver"
      DisplayMode: =If(varPr.Status in ["Pending","Review"], DisplayMode.Edit, DisplayMode.Disabled)
      OnSelect: |
        =Set(varDeclineId, varPr.Id);
         Set(varDeclineMode, "Return");
         Set(varShowDecline, true)
- btnDetApprove:
    Control: Classic/Button
    Properties:
      Text: ="✓ Approve"
      X: =1200
      Y: =92
      Width: =132
      Height: =38
      Fill: =RGBA(175, 209, 0, 1)
      Color: =RGBA(0, 73, 122, 1)
      HoverFill: =ColorFade(Self.Fill, -10%)
      BorderStyle: =BorderStyle.None
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Font: =Font.Arial
      FontWeight: =FontWeight.Bold
      Size: =10
      Visible: =varRole = "Approver"
      DisplayMode: =If(varPr.Status in ["Pending","Review"], DisplayMode.Edit, DisplayMode.Disabled)
      OnSelect: |
        =Patch(colRequisitions, LookUp(colRequisitions, Id = varPr.Id), {Status:"Approved"});
         Set(varPr, LookUp(colRequisitions, Id = varSelectedPr));
         Notify(varPr.Id & " approved — purchase order drafted", NotificationType.Success)
- btnDetEdit:
    Control: Classic/Button
    Properties:
      Text: =If(varPr.Status = "Returned", "Edit & resubmit", "Edit")
      X: =1080
      Y: =92
      Width: =130
      Height: =38
      Fill: =If(varPr.Status = "Returned", RGBA(0, 73, 122, 1), RGBA(255, 255, 255, 1))
      Color: =If(varPr.Status = "Returned", RGBA(255, 255, 255, 1), RGBA(0, 73, 122, 1))
      BorderColor: =RGBA(0, 73, 122, 1)
      BorderThickness: =1
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Font: =Font.Arial
      FontWeight: =FontWeight.Bold
      Size: =10
      Visible: =varRole <> "Approver"
      OnSelect: =Navigate(NewRequisition, ScreenTransition.None)
- btnDetWithdraw:
    Control: Classic/Button
    Properties:
      Text: ="Withdraw"
      X: =1220
      Y: =92
      Width: =112
      Height: =38
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(0, 73, 122, 1)
      BorderColor: =RGBA(0, 73, 122, 1)
      BorderThickness: =1
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Font: =Font.Arial
      FontWeight: =FontWeight.Bold
      Size: =10
      Visible: =varRole <> "Approver" && varPr.Status in ["Pending","Review"]
      OnSelect: |
        =Patch(colRequisitions, LookUp(colRequisitions, Id = varPr.Id), {Status:"Draft"});
         Set(varPr, LookUp(colRequisitions, Id = varSelectedPr));
         Notify(varPr.Id & " withdrawn to draft", NotificationType.Information)
- conDecision:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =282
      Y: =166
      Width: =1050
      Height: =62
      Visible: =!IsBlank(varPr.DecisionReason)
      Fill: =If(varPr.DecisionMode = "Reject", RGBA(249, 229, 237, 1), RGBA(251, 243, 220, 1))
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
    Children:
      - lblDecisionTitle:
          Control: Label
          Properties:
            Text: =If(varPr.DecisionMode = "Reject", "Rejected", "Returned for edit") & " by M. Brunner"
            X: =18
            Y: =8
            Width: =900
            Height: =20
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Size: =10
            Color: =If(varPr.DecisionMode = "Reject", RGBA(197, 0, 68, 1), RGBA(122, 90, 0, 1))
      - lblDecisionReason:
          Control: Label
          Properties:
            Text: ="“" & varPr.DecisionReason & "”"
            X: =18
            Y: =30
            Width: =1000
            Height: =24
            Font: =Font.Arial
            Size: =10
            Color: =RGBA(64, 64, 65, 1)
